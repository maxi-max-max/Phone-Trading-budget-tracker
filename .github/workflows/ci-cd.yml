name: CI/CD Pipeline

# Trigger on push to main or pull requests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Continuous Integration (Test & Build)
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run Tests & Check Coverage
      # The flag --cov-fail-under=70 causes the pipeline to FAIL if <70%
      run: |
        cd backend
        pytest --cov=. --cov-fail-under=70

    - name: Build Docker Image (Verify Build)
      run: docker build . --file Dockerfile --tag my-app:test

  # JOB 2: Continuous Deployment (Deploy to Cloud)
  deploy:
    needs: build-and-test  # Only run if tests pass
    if: github.ref == 'refs/heads/main'  # Only deploy from main branch
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Render
        # We will set this URL in the next phase
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}